plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mohitrathod.kitchentimer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mohitrathod.kitchentimer'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def releaseStore = System.getenv('RELEASE_STORE_FILE')
    def releaseStorePassword = System.getenv('RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')
    def hasReleaseSigning = releaseStore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.all { outputFileName = 'kitchentimer.apk' }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
